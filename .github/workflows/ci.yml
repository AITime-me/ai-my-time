name: Core CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neo
          POSTGRES_PASSWORD: neo
          POSTGRES_DB: ai_my_time_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neo -d ai_my_time_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      AI_MY_TIME_TEST_DATABASE_URL: postgresql+asyncpg://neo:neo@localhost:5432/ai_my_time_test
      DATABASE_URL: postgresql+asyncpg://neo:neo@localhost:5432/ai_my_time_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/pyproject.toml
      - name: Install project and test dependencies
        working-directory: services/core
        run: pip install '.[dev]'
      - name: Apply project migrations
        working-directory: services/core
        run: alembic upgrade head
      - name: Run full suite
        working-directory: services/core
        run: pytest -q tests
