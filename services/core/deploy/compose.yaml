name: ai-my-time

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_my_time
      POSTGRES_USER: ai_my_time
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /srv/ai-my-time/secrets/postgres_password:/run/secrets/postgres_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_my_time -d ai_my_time"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  api:
    image: ai-my-time-core:${AI_MY_TIME_RELEASE_SHA:?AI_MY_TIME_RELEASE_SHA is required}
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      TELEGRAM_TRANSPORT_MODE: edge
      TELEGRAM_EDGE_URL: https://edge.aimytimebot.ru
      TELEGRAM_CHANNEL_URL: https://t.me/AIautomationsales
      TELEGRAM_EDGE_CORE_SECRET_FILE: /run/secrets/telegram_edge_core_secret
      TELEGRAM_EDGE_INBOUND_SECRET_FILE: /run/secrets/telegram_edge_inbound_secret
      # Diagnostic AI is isolated to the API process. Its folder ID is supplied
      # only by the deploy environment; the credential is a read-only file.
      DIAGNOSTIC_PROVIDER: yandex_production
      YANDEX_PRODUCTION_FOLDER_ID: ${YANDEX_PRODUCTION_FOLDER_ID:?YANDEX_PRODUCTION_FOLDER_ID is required}
      YANDEX_PRODUCTION_API_KEY_PATH: /run/secrets/yandex_production_api_key
      YANDEX_PRODUCTION_MODEL: yandexgpt/latest
      # Website consultant: reachable only from the local website process via
      # 127.0.0.1:18181; requests carrying nginx forwarding headers get 404.
      WEBSITE_CONSULTANT_ENABLED: "true"
      WEBSITE_CONSULTANT_SECRET_PATH: /run/secrets/website_consultant_secret
      # Exact Admin browser Origin for mutation CSRF guard (Radar Admin included).
      ADMIN_TRUSTED_ORIGIN: https://admin.aimytimebot.ru
      # File-backed Reader bearer secrets for /internal/radar/v1/...
      RADAR_READER_CREDENTIALS_PATH: /run/secrets/radar_reader_credentials
    volumes:
      - /srv/ai-my-time/secrets/database_url:/run/secrets/database_url:ro
      - /srv/ai-my-time/secrets/telegram_edge_core_secret:/run/secrets/telegram_edge_core_secret:ro
      - /srv/ai-my-time/secrets/telegram_edge_inbound_secret:/run/secrets/telegram_edge_inbound_secret:ro
      - /srv/ai-my-time/secrets/yandex_production_api_key:/run/secrets/yandex_production_api_key:ro
      # Create this file (mode 0400) before deploying; otherwise Docker creates
      # a directory here and the consultant endpoint stays at 503.
      - /srv/ai-my-time/secrets/website_consultant_secret:/run/secrets/website_consultant_secret:ro
      - /srv/ai-my-time/secrets/radar_reader_credentials:/run/secrets/radar_reader_credentials:ro
    ports:
      - "127.0.0.1:18181:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200"]
      interval: 10s
      timeout: 5s
      retries: 12
    # API reaches only the foreign Telegram Edge; it no longer holds the bot
    # token or contacts Telegram directly.
    networks: [private, edge, egress]

  worker:
    image: ai-my-time-core:${AI_MY_TIME_RELEASE_SHA:?AI_MY_TIME_RELEASE_SHA is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      TELEGRAM_TRANSPORT_MODE: edge
      TELEGRAM_EDGE_URL: https://edge.aimytimebot.ru
      TELEGRAM_EDGE_CORE_SECRET_FILE: /run/secrets/telegram_edge_core_secret
      TELEGRAM_OPS_BOT_TOKEN_PATH: /run/secrets/telegram_ops_bot_token
      TELEGRAM_OPS_CHAT_ID: "-1004328477143"
    volumes:
      - /srv/ai-my-time/secrets/database_url:/run/secrets/database_url:ro
      - /srv/ai-my-time/secrets/telegram_edge_core_secret:/run/secrets/telegram_edge_core_secret:ro
      - /srv/ai-my-time/secrets/telegram_ops_bot_token:/run/secrets/telegram_ops_bot_token:ro
    command: ["python", "-m", "scripts.run_outbound_worker"]
    networks: [private, egress]

  # Isolated Demand Radar Bot outbox. Never shares Lead Bot token or process.
  radar_alert_worker:
    image: ai-my-time-core:${AI_MY_TIME_RELEASE_SHA:?AI_MY_TIME_RELEASE_SHA is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      RADAR_ALERT_BOT_TOKENS_PATH: /run/secrets/radar_alert_bot_tokens
    volumes:
      - /srv/ai-my-time/secrets/database_url:/run/secrets/database_url:ro
      - /srv/ai-my-time/secrets/radar_alert_bot_tokens:/run/secrets/radar_alert_bot_tokens:ro
    command: ["python", "-m", "scripts.run_radar_alert_worker"]
    networks: [private, egress]

volumes:
  postgres_data:

networks:
  private:
    internal: true
  edge:
  egress:
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv6: nat
