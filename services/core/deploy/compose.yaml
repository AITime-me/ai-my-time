name: ai-my-time

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_my_time
      POSTGRES_USER: ai_my_time
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /srv/ai-my-time/secrets/postgres_password:/run/secrets/postgres_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_my_time -d ai_my_time"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  api:
    image: ai-my-time-core:${AI_MY_TIME_RELEASE_SHA:?AI_MY_TIME_RELEASE_SHA is required}
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_LEAD_WEBHOOK_SECRET_FILE: /run/secrets/telegram_webhook_secret
      # Diagnostic AI is isolated to the API process. Its folder ID is supplied
      # only by the deploy environment; the credential is a read-only file.
      DIAGNOSTIC_PROVIDER: yandex_production
      YANDEX_PRODUCTION_FOLDER_ID: ${YANDEX_PRODUCTION_FOLDER_ID:?YANDEX_PRODUCTION_FOLDER_ID is required}
      YANDEX_PRODUCTION_API_KEY_PATH: /run/secrets/yandex_production_api_key
      YANDEX_PRODUCTION_MODEL: yandexgpt/latest
    volumes:
      - /srv/ai-my-time/secrets/database_url:/run/secrets/database_url:ro
      - /srv/ai-my-time/secrets/telegram_bot_token:/run/secrets/telegram_bot_token:ro
      - /srv/ai-my-time/secrets/telegram_webhook_secret:/run/secrets/telegram_webhook_secret:ro
      - /srv/ai-my-time/secrets/yandex_production_api_key:/run/secrets/yandex_production_api_key:ro
    ports:
      - "127.0.0.1:18181:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200"]
      interval: 10s
      timeout: 5s
      retries: 12
    # API needs IPv6 egress only for the short, best-effort
    # answerCallbackQuery UX acknowledgement. It publishes no ports on this
    # network; inbound traffic remains limited to the loopback edge binding.
    networks: [private, edge, egress]

  worker:
    image: ai-my-time-core:${AI_MY_TIME_RELEASE_SHA:?AI_MY_TIME_RELEASE_SHA is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    volumes:
      - /srv/ai-my-time/secrets/database_url:/run/secrets/database_url:ro
      - /srv/ai-my-time/secrets/telegram_bot_token:/run/secrets/telegram_bot_token:ro
    command: ["python", "-m", "scripts.run_outbound_worker"]
    networks: [private, egress]

volumes:
  postgres_data:

networks:
  private:
    internal: true
  edge:
  egress:
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv6: nat
